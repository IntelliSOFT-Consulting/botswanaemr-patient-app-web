## Microservice Properties
notification=${NOTIFICATION_SERVICE_URL:http://0.0.0.0:7001}
authentication=${AUTHENTICATION_SERVICE_URL:http://0.0.0.0:8081}

spring.jpa.hibernate.ddl-auto = create-drop
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:intellisoft}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=true
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:100}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5467/bitri_ambulance}