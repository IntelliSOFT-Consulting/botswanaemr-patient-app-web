
## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format.sql = true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.datasource.url=${AMBULANCE_SPRING_DATASOURCE_URL}
spring.datasource.username=${AMBULANCE_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${AMBULANCE_SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=true
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:1}
spring.datasource.hikari.minimum-idle=${AMBULANCE_SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}

