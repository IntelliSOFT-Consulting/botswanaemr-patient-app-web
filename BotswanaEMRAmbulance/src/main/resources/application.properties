server.port=${AMBULANCE_SERVER_PORT}
spring.application.name=${AMBULANCE_SPRING_APPLICATION_NAME}

## Microservice Properties
authentication=${AUTHENTICATION_SERVICE_URL}
notification=${NOTIFICATION_SERVICE_URL}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:server}

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format.sql = true
# Hibernate ddl auto (create, create-drop, validate, update)

#Keycloak
keycloak.ssl-required=${KEYCLOAK_SSL_REQUIRED:external}
app.keycloak.grant-type=${APP_KEYCLOAK_GRANT_TYPE:password}
app.keycloak.scope=${APP_KEYCLOAK_SCOPE:openid, profile}


app.keycloak.client-secret=${APP_KEYCLOAK_CLIENT_SECRET}
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
app.keycloak.authServerUrl=${APP_KEYCLOAK_AUTH_SERVER_URL:${keycloak.auth-server-url}}

keycloak.resource=${KEYCLOAK_RESOURCE}
keycloak.realm=${KEYCLOAK_REALM}
app.keycloak.client-id =${keycloak.resource}

app.keycloak.realm.username=${APP_KEYCLOAK_REALM_USERNAME:admin}
app.keycloak.realm.password=${APP_KEYCLOAK_REALM_PASSWORD}

keycloak.confidential-port=${KEYCLOAK_CONFIDENTIAL_PORT:443}

keycloak.use-resource-role-mappings=${KEYCLOAK_USE_RESOURCE_ROLE_MAPPINGS:true}
#The line below will prevent redirect to login page
keycloak.bearer-only=${KEYCLOAK_BEARER_ONLY:true}
keycloak.disable-trust-manager=${KEYCLOAK_DISABLE_TRUST_MANAGER:true}

