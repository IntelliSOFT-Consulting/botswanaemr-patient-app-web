version: "3.5"
services:
  botswana_emr_appointments:
    build: .
    image: dnjau/botswana_emr_appointments_image:latest
    container_name: botswanaappointments
    command: bash -c "java -jar ./botswana_emr_appointments_java_backend/BotswanaEMRAppointments-0.0.1-SNAPSHOT.jar"
    ports:
      - "8082:8082"
    volumes:
      - .:/botswana_emr_appointments_java_backend
networks:
  default:
    external:
      name: botswana-emr-network