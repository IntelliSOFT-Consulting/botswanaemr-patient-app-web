version: "3.5"
services:
  botswana_emr_auth:
    build: .
    image: dnjau/botswana_emr_auth_image:latest
    container_name: botswanaauth
#    command: bash -c "java -jar -Dspring.profiles.active=server ./botswana_emr_auth_javabackend/BotswanaEMRAuthentication-0.0.1-SNAPSHOT.jar"
    command: bash -c "java -jar ./botswana_emr_auth_javabackend/BotswanaEMRAuthentication-0.0.1-SNAPSHOT.jar"
    ports:
