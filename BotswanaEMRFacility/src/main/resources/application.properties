server.port=${FACILITY_SERVER_PORT}
spring.application.name=${FACILITY_SPRING_APPLICATION_NAME}

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format.sql = true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.datasource.url=${FACILITY_SPRING_DATASOURCE_URL}
spring.datasource.hikari.maximum-pool-size=${FACILITY_SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:1}
spring.datasource.username=${FACILITY_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${FACILITY_SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=${FACILITY_SPRING_JPA_SHOW_SQL:true}
