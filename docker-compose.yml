version: "3.8"

networks:
  emr_network:
    external: true
    name: docker_emr_network

#volumes:
#  postgres_data:

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/star.intellisoftkenya.com.crt:/opt/star.intellisoftkenya.com.crt:ro
      - ./certs/star.intellisoftkenya.com.key:/opt/star.intellisoftkenya.com.key:ro
    depends_on:
      - authservice
      - fileservice
      - ambulanceservice
      - facilityservice
      - appointmentservice
      - notificationservice
      - frontendservice
#      - keycloak
    networks:
      - emr_network

  authservice:
    container_name: authservice
    image: intellisoftdev/botswana_emr_auth_image:latest
    build:
      context: ./BotswanaEMRAuthentication
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${AUTH_HOST_PORT}:${AUTH_SERVER_PORT}"
    env_file:
      - .env.merged
    networks:
      - emr_network

  fileservice:
    container_name: fileservice
    image: intellisoftdev/botswana_emr_file_storage_image:latest
    build:
      context: ./BotswanaEMRFileStorage
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${FILESTORAGE_HOST_PORT}:${FILESTORAGE_SERVER_PORT}"
    env_file:
      - .env.merged
    networks:
      - emr_network

  ambulanceservice:
    container_name: ambulanceservice
    image: intellisoftdev/botswana_emr_ambulance_image:latest
    build:
      context: ./BotswanaEMRAmbulance
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${AMBULANCE_HOST_PORT}:${AMBULANCE_SERVER_PORT}"
    env_file:
      - .env.merged
    networks:
      - emr_network

  facilityservice:
    container_name: facilityservice
    image: intellisoftdev/botswana_emr_facility_image:latest
    build:
      context: ./BotswanaEMRFacility
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${FACILITY_HOST_PORT}:${FACILITY_SERVER_PORT}"
    env_file:
      - .env.merged
    networks:
      - emr_network

  appointmentservice:
    container_name: appointmentservice
    image: intellisoftdev/botswana_emr_appointments_image:latest
    build:
      context: ./BotswanaEMRAppointments
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APPOINTMENTS_HOST_PORT}:${APPOINTMENTS_SERVER_PORT}"
    env_file:
      - .env.merged
    networks:
      - emr_network

  notificationservice:
    container_name: notificationservice
    image: intellisoftdev/botswana_emr_notifications_image:latest
    build:
      context: ./BotswanaEMRNotifications
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${NOTIFICATIONS_HOST_PORT}:${NOTIFICATIONS_SERVER_PORT}"
    env_file:
      - .env.merged
    networks:
      - emr_network

  frontendservice:
    container_name: frontendservice
    ports:
      - "8888:80"
    image: nyatindopatrick/patients-ui-patient-app:latest
    restart: always
    networks:
      - emr_network

