networks:
  emr_network:

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/star.intellisoftkenya.com.crt:/opt/star.intellisoftkenya.com.crt:ro
      - ./certs/star.intellisoftkenya.com.key:/opt/star.intellisoftkenya.com.key:ro
    depends_on:
      - authservice
      - fileservice
      - ambulanceservice
      - facilityservice
      - appointmentservice
      - notificationservice
      - frontendservice
      - keycloak
    networks:
      - emr_network

  authservice:
    container_name: authservice
    # image: intellisoftdev/botswana_emr_auth_image:v3
    build:
      context: ../BotswanaEMRAuthentication
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8081"
    networks:
      - emr_network

  fileservice:
    container_name: fileservice
    # image: dnjau/botswana_emr_file_storage_image:v2
    build:
      context: ../BotswanaEMRFileStorage
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7003:7003"
    networks:
      - emr_network

  ambulanceservice:
    container_name: ambulanceservice
    # image: dnjau/botswana_emr_ambulance_image:v2
    build:
      context: ../BotswanaEMRAmbulance
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7002:7002"
    networks:
      - emr_network

  facilityservice:
    container_name: facilityservice
    # image: dnjau/botswana_emr_facility_image:1
    build:
      context: ../BotswanaEMRFacility
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7000:7000"
    networks:
      - emr_network

  appointmentservice:
    container_name: appointmentservice
    # image: dnjau/botswana_emr_appointments_image:v2
    build:
      context: ../BotswanaEMRAppointments
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8082:8082"
    networks:
      - emr_network

  notificationservice:
    container_name: notificationservice
    # image: dnjau/botswana_emr_notifications_image:v1
    build:
      context: ../BotswanaEMRNotifications
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7001:7001"
    networks:
      - emr_network

  frontendservice:
    container_name: frontendservice
    ports:
      - "8888:80"
    image: nyatindopatrick/patients-ui-patient-app:latest
    restart: always
    networks:
      - emr_network

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    restart: always
    env_file:
      - keycloak.env
    command: ["start-dev"]
    networks:
      - emr_network
