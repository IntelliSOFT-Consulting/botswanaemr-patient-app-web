version: "3.8"

networks:
  emr_network:

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/star.intellisoftkenya.com.crt:/opt/star.intellisoftkenya.com.crt:ro
      - ./certs/star.intellisoftkenya.com.key:/opt/star.intellisoftkenya.com.key:ro
    depends_on:
      - authservice
      - fileservice
      - ambulanceservice
      - facilityservice
      - appointmentservice
      - notificationservice
      - frontendservice
      - keycloak
    networks:
      - emr_network

  authservice:
    container_name: authservice
    build:
      context: ./BotswanaEMRAuthentication
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env.merged
    networks:
      - emr_network

  fileservice:
    container_name: fileservice
    build:
      context: ./BotswanaEMRFileStorage
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7003:7003"
    env_file:
      - .env.merged
    networks:
      - emr_network

  ambulanceservice:
    container_name: ambulanceservice
    build:
      context: ./BotswanaEMRAmbulance
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7002:7002"
    env_file:
      - .env.merged
    networks:
      - emr_network

  facilityservice:
    container_name: facilityservice
    build:
      context: ./BotswanaEMRFacility
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7000:7000"
    env_file:
      - .env.merged
    networks:
      - emr_network

  appointmentservice:
    container_name: appointmentservice
    build:
      context: ./BotswanaEMRAppointments
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8082:8082"
    env_file:
      - .env.merged
    networks:
      - emr_network

  notificationservice:
    container_name: notificationservice
    build:
      context: ./BotswanaEMRNotifications
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7001:7001"
    env_file:
      - .env.merged
    networks:
      - emr_network

  frontendservice:
    container_name: frontendservice
    ports:
      - "8888:80"
    image: nyatindopatrick/patients-ui-patient-app:latest
    restart: always
    networks:
      - emr_network

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    restart: always
    env_file:
      - keycloak.env
    command: ["start-dev"]
    networks:
      - emr_network