worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # Redirect all HTTP requests to HTTPS
    server {
        listen 80;
        server_name botswanapatientapp.intellisoftkenya.com botswanaemrauth.intellisoftkenya.com;
        return 301 https://$host$request_uri;
    }

    # SSL Configuration
    ssl_certificate /opt/star.intellisoftkenya.com.crt;
    ssl_certificate_key /opt/star.intellisoftkenya.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    server {
        listen 443 ssl;
        server_name botswanapatientapp.intellisoftkenya.com;


        location / {
            proxy_pass http://frontendservice:80/;
            # rewrite ^/home(/|$)(.*) /$2 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auths/ {
            proxy_pass http://authservice:8081/auths/;
            # rewrite ^/auths(/|$)(.*) /$2 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /filestorage/ {
            proxy_pass http://fileservice:7003/filestorage/;
            # rewrite ^/filestorage(/|$)(.*) /$2 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ambulance/ {
            proxy_pass http://ambulanceservice:7002/ambulance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # rewrite ^/ambulance(/|$)(.*) /$2 break;
        }

        location /facility/ {
            proxy_pass http://facilityservice:7000/facility/;
            # rewrite ^/facility(/|$)(.*) /$2 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /appointments/ {
            proxy_pass http://appointmentservice:8082/appointments/;
            # rewrite ^/appointments(/|$)(.*) /$2 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /notification/ {
            proxy_pass http://notificationservice:7001/notification/;
            # rewrite ^/notification(/|$)(.*) /$2 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
    }

    server {
        listen 443 ssl;
        server_name botswanaemrauth.intellisoftkenya.com;

        location / {
        proxy_pass http://keycloak:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth {
        proxy_pass http://keycloak:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
