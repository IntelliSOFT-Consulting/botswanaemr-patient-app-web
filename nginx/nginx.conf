worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # Use Docker's embedded DNS — required for $upstream variable re-resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── Timeouts ─────────────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name botswanapatientapp.intellisoftkenya.com botswanaemrauth.intellisoftkenya.com;
        return 301 https://$host$request_uri;
    }

    # ─── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /opt/star.intellisoftkenya.com.crt;
    ssl_certificate_key /opt/star.intellisoftkenya.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Drop unknown hosts (block scanners) ──────────────────────────────────
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }

    # =========================================================================
    # Patient App
    # =========================================================================
    server {
        listen 443 ssl;
        server_name botswanapatientapp.intellisoftkenya.com;

        location / {
            set $upstream_frontend http://frontendservice:80;
            proxy_pass $upstream_frontend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auths/ {
            set $upstream_auth http://authservice:8081;
            proxy_pass $upstream_auth/auths/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /filestorage/ {
            set $upstream_file http://fileservice:7003;
            proxy_pass $upstream_file/filestorage/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ambulance/ {
            set $upstream_ambulance http://ambulanceservice:7002;
            proxy_pass $upstream_ambulance/ambulance/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /facility/ {
            set $upstream_facility http://facilityservice:7000;
            proxy_pass $upstream_facility/facility/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /appointments/ {
            set $upstream_appointments http://appointmentservice:8082;
            proxy_pass $upstream_appointments/appointments/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /notification/ {
            set $upstream_notification http://notificationservice:7001;
            proxy_pass $upstream_notification/notification/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # Keycloak Auth
    # =========================================================================
    server {
        listen 443 ssl;
        server_name botswanaemrauth.intellisoftkenya.com;

        location / {
            set $upstream_keycloak http://keycloak:8080;
            proxy_pass $upstream_keycloak/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding   "";
        }

        location /auth {
            set $upstream_keycloak_auth http://keycloak:8080;
            proxy_pass $upstream_keycloak_auth/auth;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding   "";
        }
    }
}