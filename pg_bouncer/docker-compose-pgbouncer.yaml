# =============================================================================
# PgBouncer — Connection Pooler for BotswanaEMR Microservices
#
# Databases managed:
#   - bitri_ambulance     (BotswanaEMRAmbulance)
#   - authentication      (BotswanaEMRAuthentication)
#   - facility            (BotswanaEMRFacility)
#   - file_storage        (BotswanaEMRFileStorage)
#   - bitri_notifications (BotswanaEMRNotifications)
#
# Before starting:
#   1. From root: ./generate_userlist.sh → Option [1] to create pg_bouncer/userlist.txt
#   2. Start:     docker compose --env-file pg_bouncer/.env -f pg_bouncer/docker-compose-pgbouncer.yaml up -d
#
# Microservices connect to:
#   jdbc:postgresql://<this-host>:5433/<dbname>?prepareThreshold=0
#
# Monitoring:
#   Grafana   → http://<host>:3000  (admin / admin)
#   Prometheus → http://<host>:9090
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PgBouncer
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    container_name: spring_pgbouncer
    restart: unless-stopped

    ports:
      - "${PG_BOUNCER_HOST_PORT}:${PG_BOUNCER_DB_PORT}"   # 5433 → 5432

    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$SPRING_DATABASE_USERNAME"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - docker_emr_network

  # ---------------------------------------------------------------------------
  # PgBouncer Exporter — exposes SHOW STATS/POOLS as Prometheus metrics
  # ---------------------------------------------------------------------------
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    container_name: pgbouncer_exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: "postgresql://${SPRING_DATABASE_USERNAME}:${SPRING_DATABASE_PASSWORD}@spring_pgbouncer:5432/pgbouncer?sslmode=disable"

    ports:
      - "${GRAFANA_EXPORTER_HOST_PORT}:${GRAFANA_EXPORTER_SERVER_PORT}"

    depends_on:
      pgbouncer:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    networks:
      - docker_emr_network

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes pgbouncer-exporter
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: pgbouncer_prometheus
    restart: unless-stopped

    ports:
      - "${GRAFANA_PROMETHEUS_HOST_PORT}:${GRAFANA_PROMETHEUS_SERVER_PORT}"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"       # allows POST /-/reload to reload config

    depends_on:
      - pgbouncer-exporter

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    networks:
      - docker_emr_network

  # ---------------------------------------------------------------------------
  # Grafana — dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: pgbouncer_grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_HOST_PORT}:${GRAFANA_SERVER_PORT}"

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # optional: auto-provision datasource + dashboard

    depends_on:
      - prometheus

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    networks:
      - docker_emr_network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  prometheus_data:
  grafana_data:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  docker_emr_network:
    external: true