[databases]
; ─── BotswanaEMR Microservice Databases ──────────────────────────────────────
; Host and credentials are read from .env.general
; All pointing to the same PostgreSQL host with their respective databases
bitri_ambulance     = host=172.105.157.130 port=5432 dbname=bitri_ambulance
authentication      = host=172.105.157.130 port=5432 dbname=authentication
facility            = host=172.105.157.130 port=5432 dbname=facility
file_storage        = host=172.105.157.130 port=5432 dbname=file_storage
bitri_notifications = host=172.105.157.130 port=5432 dbname=bitri_notifications

[pgbouncer]
; ─── Network ──────────────────────────────────────────────────────────────────
listen_addr          = 0.0.0.0
listen_port          = 5432

; ─── JDBC Compatibility ───────────────────────────────────────────────────────
; PostgreSQL JDBC driver sends extra_float_digits on connect; PgBouncer must ignore it
ignore_startup_parameters = extra_float_digits

; ─── Auth — matches generate_userlist.sh and .env.general ────────────────────
auth_type            = scram-sha-256
auth_file            = /etc/pgbouncer/userlist.txt

; ─── Pooling ──────────────────────────────────────────────────────────────────
; transaction mode — required when prepareThreshold=0 is set in JDBC URLs
pool_mode            = transaction

; 5 databases × 10 = 50 max real PostgreSQL connections
max_client_conn      = 200
default_pool_size    = 10
min_pool_size        = 2
reserve_pool_size    = 5
reserve_pool_timeout = 3

; ─── Connection Timeouts ──────────────────────────────────────────────────────
; Close idle server connections after 60s
server_idle_timeout  = 60
; Recycle server connections every 10 min
server_lifetime      = 600
; Disabled — Hikari manages client side
client_idle_timeout  = 0
; Disabled — no hard query time limit
query_timeout        = 0
; Fail fast if PostgreSQL is unreachable
server_connect_timeout = 15

; ─── Logging ──────────────────────────────────────────────────────────────────
log_connections      = 1
log_disconnections   = 1
log_pooler_errors    = 1

; ─── Admin ────────────────────────────────────────────────────────────────────
; Must match the username in userlist.txt and .env.general SPRING_DATABASE_USERNAME
admin_users          = intellisoft
stats_users          = intellisoft